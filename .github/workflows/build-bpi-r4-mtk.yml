name: Build BPI-R4 MTK

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt commit/ref"
        required: true
        default: "155eea44e7695c5cd017a240469cac57c19af64b"
      mtk_feed_ref:
        description: "MTK feed commit/ref"
        required: true
        default: "31c492d5c761176fcb15a3099f30d846450c01f5"
      include_regdb_patch:
        description: "Apply optional tx power / regdb patch"
        type: boolean
        required: true
        default: false
      create_release:
        description: "Create GitHub Release"
        type: boolean
        required: true
        default: true
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-bpi-r4-mtk.yml"
      - "defconfig/**"
      - "files/**"
      - "scripts/**"
      - "patches/**"

permissions:
  contents: write

concurrency:
  group: bpi-r4-mtk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || '155eea44e7695c5cd017a240469cac57c19af64b' }}
      MTK_FEED_REF: ${{ github.event.inputs.mtk_feed_ref || '31c492d5c761176fcb15a3099f30d846450c01f5' }}
      OPENWRT_DIR: ${{ github.workspace }}/build/openwrt
      MTK_FEEDS_DIR: ${{ github.workspace }}/build/mtk-openwrt-feeds
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v5

      - name: Show disk space
        run: |
          df -h
          nproc
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev qemu-utils ccache \
            subversion time xsltproc zstd

      - name: Clone OpenWrt and MTK feeds
        run: |
          set -euxo pipefail
          rm -rf build
          mkdir -p build

          git clone --branch openwrt-24.10 https://git.openwrt.org/openwrt/openwrt.git "$OPENWRT_DIR"
          cd "$OPENWRT_DIR"
          git checkout "$OPENWRT_REF"

          cd "$GITHUB_WORKSPACE"
          git clone https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds "$MTK_FEEDS_DIR"
          cd "$MTK_FEEDS_DIR"
          git checkout "$MTK_FEED_REF"
          echo "${MTK_FEED_REF:0:7}" > autobuild/unified/feed_revision

      - name: Optional regdb tx power patch
        if: ${{ github.event.inputs.include_regdb_patch == 'true' }}
        run: |
          set -euxo pipefail
          test -f patches/optional/500-tx_power.patch
          test -f patches/optional/regdb.Makefile

          rm -rf "$OPENWRT_DIR/package/firmware/wireless-regdb/patches"
          mkdir -p "$OPENWRT_DIR/package/firmware/wireless-regdb/patches"

          MTK_REGDB_PATCH_DIR="$MTK_FEEDS_DIR/autobuild/unified/filogic/mac80211/24.10/files/package/firmware/wireless-regdb/patches"
          rm -rf "$MTK_REGDB_PATCH_DIR"
          mkdir -p "$MTK_REGDB_PATCH_DIR"

          cp patches/optional/500-tx_power.patch "$MTK_REGDB_PATCH_DIR/500-tx_power.patch"
          cp patches/optional/regdb.Makefile "$OPENWRT_DIR/package/firmware/wireless-regdb/Makefile"

      - name: Run MTK autobuild prepare
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          bash "$MTK_FEEDS_DIR/autobuild/unified/autobuild.sh" \
            filogic-mac80211-mt7988_rfb-mt7996 \
            log_file=make

      - name: Install feeds
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config and files
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          cp "$GITHUB_WORKSPACE/defconfig/mt7988-bpi-r4-be14.config" .config
          mkdir -p files
          rsync -a "$GITHUB_WORKSPACE/files/" files/
          make defconfig

          echo "===== final diffconfig ====="
          ./scripts/diffconfig.sh | tee "$GITHUB_WORKSPACE/final.diffconfig"
          "$GITHUB_WORKSPACE/scripts/check-config.sh" .config

      - name: Download packages
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          make download -j"$(nproc)" V=s

      - name: Build firmware
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" V=s

      - name: Collect artifacts
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p "$ARTIFACT_DIR"
          if [ -d "$OPENWRT_DIR/bin/targets/mediatek/filogic" ]; then
            cp -av "$OPENWRT_DIR/bin/targets/mediatek/filogic/"* "$ARTIFACT_DIR/" || true
          fi

          cp -av "$GITHUB_WORKSPACE/final.diffconfig" "$ARTIFACT_DIR/" || true
          if [ -d "$OPENWRT_DIR/logs" ]; then
            mkdir -p "$ARTIFACT_DIR/logs"
            cp -av "$OPENWRT_DIR/logs/"* "$ARTIFACT_DIR/logs/" || true
          fi

          "$GITHUB_WORKSPACE/scripts/print-artifacts.sh" "$ARTIFACT_DIR"
          cd "$ARTIFACT_DIR"
          find . -maxdepth 1 -type f -print0 | xargs -0 sha256sum > sha256sums.txt || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpi-r4-mtk-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Create release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bpi-r4-mtk-${{ github.run_number }}
          name: BPI-R4 MTK build ${{ github.run_number }}
          body: |
            Banana Pi BPI-R4 MTK feed build.

            Default IP: 192.168.6.1
            LuCI theme: Argon
            Language: zh_cn
            MTK feed ref: ${{ env.MTK_FEED_REF }}
            OpenWrt ref: ${{ env.OPENWRT_REF }}
            Regdb tx power patch: ${{ github.event.inputs.include_regdb_patch }}

            Use `*-sdcard*.img.gz` for SD card boot.
            Use `*-sysupgrade.itb` only after the router is already running OpenWrt.
          files: artifacts/*
