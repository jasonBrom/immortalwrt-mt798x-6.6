name: Build BPI-R4 and Release

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt commit/ref"
        required: true
        default: "155eea44e7695c5cd017a240469cac57c19af64b"
      mtk_feed_ref:
        description: "MTK feed commit/ref"
        required: true
        default: "31c492d5c761176fcb15a3099f30d846450c01f5"
  push:
    paths:
      - '.github/workflows/build-bpi-r4-release.yml'
      - 'defconfig/mt7988-bpi-r4-be14.config'
      - 'files/etc/uci-defaults/99-bpi-r4-defaults'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || '155eea44e7695c5cd017a240469cac57c19af64b' }}
      MTK_FEED_REF: ${{ github.event.inputs.mtk_feed_ref || '31c492d5c761176fcb15a3099f30d846450c01f5' }}
      OPENWRT_DIR: ${{ github.workspace }}/build/openwrt
      MTK_FEEDS_DIR: ${{ github.workspace }}/build/mtk-openwrt-feeds
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev qemu-utils ccache \
            subversion time xsltproc zstd

      - name: Clone OpenWrt and MTK feeds
        run: |
          set -euxo pipefail
          rm -rf build
          mkdir -p build

          git clone --branch openwrt-24.10 https://git.openwrt.org/openwrt/openwrt.git "$OPENWRT_DIR"
          cd "$OPENWRT_DIR"
          git checkout "$OPENWRT_REF"

          cd "$GITHUB_WORKSPACE"
          git clone https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds "$MTK_FEEDS_DIR"
          cd "$MTK_FEEDS_DIR"
          git checkout "$MTK_FEED_REF"
          echo "${MTK_FEED_REF:0:7}" > autobuild/unified/feed_revision

      - name: Run MTK autobuild prepare
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          bash "$MTK_FEEDS_DIR/autobuild/unified/autobuild.sh" filogic-mac80211-mt7988_rfb-mt7996 log_file=make

      - name: Install feeds
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config and defaults
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          cp -f "$GITHUB_WORKSPACE/defconfig/mt7988-bpi-r4-be14.config" .config
          rsync -a "$GITHUB_WORKSPACE/files/" files/
          make defconfig

      - name: Download sources
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          make download -j"$(nproc)" V=s

      - name: Build firmware
        run: |
          set -euxo pipefail
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" V=s

      - name: Pack artifacts
        run: |
          set -eux
          OUT="$OPENWRT_DIR/bin/targets/mediatek/filogic"
          mkdir -p artifacts
          cp -f "$OUT"/*bananapi_bpi-r4*sysupgrade*.itb artifacts/ || true
          cp -f "$OUT"/*bananapi_bpi-r4*sdcard*.img.gz artifacts/ || true
          cp -f "$OUT"/*bananapi_bpi-r4*recovery*.itb artifacts/ || true
          cp -f "$OUT"/*preloader*.bin artifacts/ || true
          cp -f "$OUT"/*uboot*.fip artifacts/ || true
          cp -f "$OUT"/*.manifest artifacts/ || true
          cp -f "$OUT"/*.buildinfo artifacts/ || true
          cp -f "$OUT"/*.sha256sums artifacts/ || true
          (cd artifacts && find . -maxdepth 1 -type f -print0 | xargs -0 sha256sum > sha256sum.local.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpi-r4-firmware
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: bpi-r4-${{ github.run_number }}
          name: BPI-R4 build #${{ github.run_number }}
          body: |
            自动编译 Banana Pi BPI-R4 固件（MTK 两阶段构建）
            - OpenWrt ref: ${{ env.OPENWRT_REF }}
            - MTK feed ref: ${{ env.MTK_FEED_REF }}
            - 默认地址: 192.168.6.1
            - LuCI 主题: Argon
            - 默认语言: 中文
            - 默认未启用 tx power patch
          files: |
            artifacts/*
