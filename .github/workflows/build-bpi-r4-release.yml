name: Build BPI-R4 and Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-bpi-r4-release.yml'
      - 'defconfig/mt7988-bpi-r4-be14.config'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Feeds update/install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load BPI-R4 config
        run: |
          cp -f defconfig/mt7988-bpi-r4-be14.config .config
          make defconfig

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Pack artifacts
        run: |
          mkdir -p artifacts
          cp -rf bin/targets/mediatek/filogic/* artifacts/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpi-r4-firmware
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: bpi-r4-${{ github.run_number }}
          name: BPI-R4 build #${{ github.run_number }}
          body: |
            自动编译 Banana Pi BPI-R4 固件
            - 默认地址: 192.168.6.1
            - LuCI 主题: Argon
            - 默认语言: 中文
            - 启用 MediaTek HNAT
            - 尝试启用 MTK 闭源 WiFi 驱动（BE14）
          files: |
            artifacts/*
